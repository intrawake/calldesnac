[project]
name = "calldesnac"
version = "0.1.0"
description = "A stripped-down SNAC audio decoder that calls an LLM API"
dependencies = [
    "torch",
    "snac",
    "requests",
    "numpy",
]
requires-python = ">=3.10"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "sxpb @ git+https://github.com/sxproto/sxpb-py@02bf7b5d5ab5be6e9756e6c0ec3d463fca2c62dd",
]

[tool.pdm.scripts]
check-format = "ruff check"
lint-sxpb = "sxpb-lint --ignore-file .gitignore"
test = "pytest -q"
tidy-python = "ruff format"
tidy-sxpb = "sxpb-tidy --ignore-file .gitignore"
tidy = {composite = ["tidy-python", "tidy-sxpb"]}
lint = {composite = ["check-format", "lint-sxpb"]}
tidytest = {composite = ["tidy", "lint"]}

[tool.ruff]
line-length = 100
