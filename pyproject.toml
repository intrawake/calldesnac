[project]
name = "calldesnac"
version = "0.1.0"
description = "A stripped-down SNAC audio decoder that calls an LLM API"
dependencies = [
    "torch",
    "snac",
    "requests",
    "numpy",
]
requires-python = ">=3.10"

[tool.pdm.dev-dependencies]
dev = [
    "ruff",
    "sxpb @ git+https://github.com/sxproto/sxpb-py@aa4e1e5830483c8ba0c549f78dce38b5be9a1885",
]

[tool.pdm.scripts]
check-format = "ruff check"
lint-sxpb = "sxpb-lint --ignore-file .gitignore"
tidy-python = "ruff format"
tidy-sxpb = "sxpb-tidy --ignore-file .gitignore"
tidy = {composite = ["tidy-python", "tidy-sxpb"]}
lint = {composite = ["check-format", "lint-sxpb"]}
tidytest = {composite = ["tidy", "lint"]}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ruff]
line-length = 100
